<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Segoe UI', 'Microsoft YaHei', Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="560" rx="16" fill="#f8fafc"/>
  <!-- 标题条 -->
  <rect x="0" y="0" width="960" height="64" rx="16" fill="url(#hdr)"/>
  <rect x="0" y="32" width="960" height="32" fill="url(#hdr)"/>
  <text x="480" y="40" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">PASM 认知循环架构 —— Predictive Agent System with Memory</text>
  <text x="480" y="82" text-anchor="middle" fill="#475569" font-size="12">内部零 token：感知→记忆→想象→规划 全在连续潜在向量空间；仅在需要与人交流时由 Narrator 桥接生成文本</text>

  <!-- ============ 主循环：6 个阶段卡片 ============ -->
  <!-- 阶段 0 -->
  <rect x="40" y="150" width="130" height="120" rx="10" fill="url(#card)" stroke="#2563eb" stroke-width="1.6"/>
  <text x="105" y="172" text-anchor="middle" fill="#2563eb" font-size="13" font-weight="700">层0 感知编码</text>
  <text x="105" y="190" text-anchor="middle" fill="#334155" font-size="11">VAE 编码器</text>
  <text x="105" y="206" text-anchor="middle" fill="#64748b" font-size="10">obs(27维) → z(8维)</text>
  <text x="105" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：感觉皮层</text>

  <!-- 阶段 1 -->
  <rect x="190" y="150" width="130" height="120" rx="10" fill="url(#card)" stroke="#0891b2" stroke-width="1.6"/>
  <text x="255" y="172" text-anchor="middle" fill="#0891b2" font-size="13" font-weight="700">层1 工作记忆</text>
  <text x="255" y="190" text-anchor="middle" fill="#334155" font-size="11">门控槽位</text>
  <text x="255" y="206" text-anchor="middle" fill="#64748b" font-size="10">上下文 c</text>
  <text x="255" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：前额叶-顶叶</text>

  <!-- 阶段 2 -->
  <rect x="340" y="150" width="150" height="120" rx="10" fill="url(#card)" stroke="#059669" stroke-width="1.6"/>
  <text x="415" y="172" text-anchor="middle" fill="#059669" font-size="13" font-weight="700">层2 三库记忆</text>
  <text x="415" y="190" text-anchor="middle" fill="#334155" font-size="10">情景·语义·程序</text>
  <text x="415" y="206" text-anchor="middle" fill="#64748b" font-size="10">KNN 检索 m</text>
  <text x="415" y="220" text-anchor="middle" fill="#64748b" font-size="10">事件驱动写入</text>
  <text x="415" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：海马/皮层/基底节</text>

  <!-- 阶段 3 -->
  <rect x="510" y="150" width="140" height="120" rx="10" fill="url(#card)" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="580" y="172" text-anchor="middle" fill="#7c3aed" font-size="13" font-weight="700">层3 世界模型</text>
  <text x="580" y="190" text-anchor="middle" fill="#334155" font-size="10">GRU 想象引擎</text>
  <text x="580" y="206" text-anchor="middle" fill="#64748b" font-size="10">z′ / r 预测</text>
  <text x="580" y="220" text-anchor="middle" fill="#64748b" font-size="10">子目标 g</text>
  <text x="580" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：皮层柱/DMN</text>

  <!-- 阶段 4 -->
  <rect x="670" y="150" width="130" height="120" rx="10" fill="url(#card)" stroke="#d97706" stroke-width="1.6"/>
  <text x="735" y="172" text-anchor="middle" fill="#d97706" font-size="13" font-weight="700">CEM 规划器</text>
  <text x="735" y="190" text-anchor="middle" fill="#334155" font-size="10">想象推演 N 条</text>
  <text x="735" y="206" text-anchor="middle" fill="#64748b" font-size="10">精英迭代</text>
  <text x="735" y="220" text-anchor="middle" fill="#64748b" font-size="10">习惯命中免规划</text>
  <text x="735" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：模型预测控制</text>

  <!-- 阶段 5 -->
  <rect x="820" y="150" width="110" height="120" rx="10" fill="url(#card)" stroke="#dc2626" stroke-width="1.6"/>
  <text x="875" y="172" text-anchor="middle" fill="#dc2626" font-size="13" font-weight="700">行动</text>
  <text x="875" y="190" text-anchor="middle" fill="#334155" font-size="11">action</text>
  <text x="875" y="206" text-anchor="middle" fill="#64748b" font-size="10">环境执行</text>
  <text x="875" y="256" text-anchor="middle" fill="#94a3b8" font-size="9">对应：运动输出</text>

  <!-- 主循环箭头 -->
  <line x1="170" y1="210" x2="186" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="210" x2="336" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="490" y1="210" x2="506" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="210" x2="666" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="800" y1="210" x2="816" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 学习反馈回路 -->
  <path d="M875,270 L875,320 L105,320 L105,274" fill="none" stroke="#dc2626" stroke-width="1.8"
        marker-end="url(#arrowr)" stroke-dasharray="6,4"/>
  <text x="490" y="336" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">学习反馈：预测误差 → 世界模型/编码器更新 · 情绪更新 · 事件驱动记忆写入 · 习惯固化</text>

  <!-- ============ 调节层（底部） ============ -->
  <rect x="40" y="365" width="280" height="90" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
  <text x="180" y="387" text-anchor="middle" fill="#b45309" font-size="12" font-weight="700">层4/5 情绪 · 性格 · 发育</text>
  <text x="180" y="406" text-anchor="middle" fill="#78350f" font-size="10">多巴胺(RPE)→学习率 · 血清素→探索平衡 · PAD 情绪向量</text>
  <text x="180" y="422" text-anchor="middle" fill="#78350f" font-size="10">性格[开放/谨慎/社交] 先天采样+后天漂移 · 可塑性随“年龄”衰减</text>
  <text x="180" y="444" text-anchor="middle" fill="#92400e" font-size="9">对应：边缘系统 + 基因/早期发育</text>

  <rect x="340" y="365" width="280" height="90" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="480" y="387" text-anchor="middle" fill="#4338ca" font-size="12" font-weight="700">层6 元认知 · 全局工作空间</text>
  <text x="480" y="406" text-anchor="middle" fill="#3730a3" font-size="10">元认知：按信号动态调学习率/记忆阈值/规划算力</text>
  <text x="480" y="422" text-anchor="middle" fill="#3730a3" font-size="10">GWS：高惊讶/奖励冲击/停滞 → 全脑广播(学习率×3·强制记忆)</text>
  <text x="480" y="444" text-anchor="middle" fill="#312e81" font-size="9">对应：前额叶高级功能 + GWT 意识广播</text>

  <rect x="640" y="365" width="290" height="90" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
  <text x="785" y="387" text-anchor="middle" fill="#047857" font-size="12" font-weight="700">离线巩固（睡眠）</text>
  <text x="785" y="406" text-anchor="middle" fill="#064e3b" font-size="10">按情绪显著性回放情景记忆</text>
  <text x="785" y="422" text-anchor="middle" fill="#064e3b" font-size="10">情景→语义抽象 · 成功行为→习惯固化</text>
  <text x="785" y="444" text-anchor="middle" fill="#065f46" font-size="9">对应：睡眠中记忆重放与巩固</text>

  <!-- 调节连线 -->
  <line x1="180" y1="365" x2="255" y2="274" stroke="#d97706" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="480" y1="365" x2="480" y2="274" stroke="#6366f1" stroke-width="1.4" stroke-dasharray="4,3"/>
  <line x1="785" y1="365" x2="640" y2="274" stroke="#059669" stroke-width="1.4" stroke-dasharray="4,3"/>

  <!-- 底部说明 -->
  <rect x="40" y="480" width="890" height="56" rx="10" fill="#1e293b"/>
  <text x="485" y="502" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">OpenAI 兼容 API</text>
  <text x="485" y="520" text-anchor="middle" fill="#cbd5e1" font-size="11">/v1/models · /v1/chat/completions (SSE 流式) —— Narrator 将内状态翻译为语言</text>
  <text x="485" y="534" text-anchor="middle" fill="#94a3b8" font-size="10">任何 OpenAI SDK / Dify / LangChain 客户端，改 base_url 即可驱动 PASM</text>
</svg>
